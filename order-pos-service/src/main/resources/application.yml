server:
  port: 8083

spring:
  application:
    name: order-pos-service
  datasource:
    url: jdbc:h2:mem:db_order;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_UPPER=false
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Cấu hình Feign Client trỏ sang Lab Service và Catalog Service
services:
  catalog-service:
    url: http://localhost:8082
  eyewear-lab-service:
    url: http://localhost:8084
