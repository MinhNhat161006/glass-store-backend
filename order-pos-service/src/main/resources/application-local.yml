# Opt in with SPRING_PROFILES_ACTIVE=local; credentials may be overridden per machine.
spring:
  datasource:
    url: ${ORDER_DB_URL:jdbc:mysql://localhost:3307/db_order?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${ORDER_DB_USERNAME:root}
    password: ${ORDER_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
