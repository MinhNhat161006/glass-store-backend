server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
      routes:
        # Route 1: identity-service (Port 8081)
        - id: identity-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**, /api/users/**

        # Route 2: catalog-service (Port 8082)
        - id: catalog-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/catalog/**, /api/products/**, /api/categories/**, /api/inventory/**

        # Route 3: order-pos-service (Port 8083)
        - id: order-pos-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/orders/**, /api/pos/**, /api/cart/**, /api/payments/**

        # Route 4: eyewear-lab-service (Port 8084)
        - id: eyewear-lab-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/prescriptions/**, /api/lab-jobs/**, /api/eye-exams/**, /api/warranties/**, /api/appointments/**

logging:
  level:
    org.springframework.cloud.gateway: INFO

